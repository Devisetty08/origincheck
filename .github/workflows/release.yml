name: Release

# Pushing a version tag (for example v1.0.0) publishes a GitHub release for it, with that version's notes from
# CHANGELOG.md. To release: add a "## vX.Y.Z (date)" section to CHANGELOG.md, then
#   git tag -a vX.Y.Z -m "origincheck vX.Y.Z" && git push origin vX.Y.Z
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Take the release notes from CHANGELOG.md
        run: |
          awk -v v="$GITHUB_REF_NAME" 'index($0, "## " v " ") == 1 || $0 == "## " v { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no '## $GITHUB_REF_NAME' section"; exit 1; }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: | # a re-pushed tag updates its existing release instead of failing
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "origincheck $GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "origincheck $GITHUB_REF_NAME" --notes-file notes.md --verify-tag --latest
          fi
