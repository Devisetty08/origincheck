name: Release

# Pushing a version tag (for example v1.0.0) publishes a GitHub release, in stages:
#
#   Release notes ─┐
#   CI (all checks)┴─► Publish release
#
# It is only published if CHANGELOG.md has notes for the version and every CI check passes. To release:
#   add a "## vX.Y.Z (date)" section to CHANGELOG.md, then
#   git tag -a vX.Y.Z -m "origincheck vX.Y.Z" && git push origin vX.Y.Z
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  notes:
    name: Release notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Take the notes for this version from CHANGELOG.md
        run: |
          awk -v v="$GITHUB_REF_NAME" 'index($0, "## " v " ") == 1 || $0 == "## " v { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::CHANGELOG.md has no '## $GITHUB_REF_NAME' section"; exit 1; }
      - uses: actions/upload-artifact@v4
        with: { name: release-notes, path: notes.md, retention-days: 1 }

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish release
    needs: [notes, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: release-notes }
      - name: Publish (a re-pushed tag updates its existing release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "origincheck $GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "origincheck $GITHUB_REF_NAME" --notes-file notes.md --verify-tag --latest
          fi
