name: CI

# The app is deployed by Vercel's GitHub integration (it needs a server for the API proxy).
# This workflow only tests: lint, types, unit tests, build and end-to-end tests with external APIs and AI models mocked.
on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - name: Unit tests (Vitest)
        run: npm test
      - run: npm run build
      - name: End-to-end tests (Playwright)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
        env:
          CI: "1"
